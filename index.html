<script type="module">
// ランキングの保存先：Firebase（Firestore＋Googleログイン）。
// アプリ本体は claude.ai 版と同じコードで、ここで保存先とログインのAPIを差し替えている。
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const MODES = ['basic', 'fdn', 'read'];
let cfg = null;
try { cfg = (await import('./config.js')).default; } catch (e) { cfg = null; }
if (!cfg || !cfg.apiKey || String(cfg.apiKey).startsWith('PASTE')) {
  window.__setClaude(null);
} else {
  let boot = null;
  // Firebase は「ランキング」を開くか自己ベストを更新したときに初めて読み込む
  const start = () => boot || (boot = (async () => {
    const [appm, authm, fs] = await Promise.all([
      import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')]);
    const app = appm.initializeApp(cfg);
    const auth = authm.getAuth(app);
    await new Promise(res => { const u = authm.onAuthStateChanged(auth, () => { u(); res(); }); }); // 前回のログイン状態を復元
    return { auth, authm, db: fs.getFirestore(app), fs };
  })());
  const toErr = e => ({ code: e && (e.code === 'unavailable' || e.code === 'permission-denied') ? e.code : 'invalid_argument', message: String(e && e.message || e) });
  window.__auth = {
    async signIn() {
      const b = await start();
      const p = new b.authm.GoogleAuthProvider();
      p.setCustomParameters({ prompt: 'select_account' });
      return (await b.authm.signInWithPopup(b.auth, p)).user;
    },
    async signOut() { const b = await start(); await b.authm.signOut(b.auth); },
    async current() { const b = await start(); const u = b.auth.currentUser; return u ? { uid: u.uid, name: u.displayName || '' } : null; },
  };
  window.__setClaude({
    use: async (name) => {
      let b;
      try { b = await start(); } catch (e) { return null; }
      const { auth, db, fs } = b;
      const uidNow = () => (auth.currentUser ? auth.currentUser.uid : null);
      if (name === 'user') return { id: async () => uidNow(), isOwner: async () => false, can: async () => !!uidNow(), profiles: async () => ({}) };
      if (name !== 'db') return null;
      return {
        collection: (path) => ({
          // 各モード上位50件＋自分の記録だけを購読（読み取り回数を抑える）
          onSnapshot: (next, error) => {
            const uid = uidNow();
            const need = MODES.length + (uid ? 1 : 0);
            const parts = {}, cache = {}, unsubs = [];
            let dead = false;
            const emit = () => {
              const all = new Map();
              Object.values(parts).forEach(m => m.forEach((d, id) => all.set(id, d)));
              const fromCache = Object.keys(parts).length < need || Object.values(cache).some(Boolean);
              next({ docs: [...all].map(([id, d]) => ({ id, exists: true, data: () => d, metadata: { fromCache, hasPendingWrites: false } })),
                size: all.size, empty: !all.size, metadata: { fromCache, hasPendingWrites: false }, docChanges: () => [] });
            };
            const fail = e => { if (dead) return; dead = true; unsubs.forEach(u => u()); error && error(toErr(e)); };
            MODES.forEach(m => unsubs.push(fs.onSnapshot(
              fs.query(fs.collection(db, path), fs.orderBy(m, 'desc'), fs.limit(50)),
              s => { parts[m] = new Map(s.docs.map(d => [d.id, d.data()])); cache[m] = s.metadata.fromCache; emit(); }, fail)));
            if (uid) unsubs.push(fs.onSnapshot(fs.doc(db, path, uid),
              s => { parts.me = new Map(s.exists() ? [[s.id, s.data()]] : []); cache.me = s.metadata.fromCache; emit(); }, fail));
            return () => { dead = true; unsubs.forEach(u => u()); };
          },
          doc: (id) => ({
            // 書き込み時刻はサーバーが付ける（ルールで「前回からの経過時間」を確かめるため）
            set: (data) => fs.setDoc(fs.doc(db, path, id), Object.assign({}, data, { ts: fs.serverTimestamp() })).catch(e => { throw toErr(e); }),
            delete: () => fs.deleteDoc(fs.doc(db, path, id)).catch(e => { throw toErr(e); }),
          }),
        }),
      };
    },
  });
}

.pname input{flex:1;min-width:0;background:#0e1018;border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:8px 10px}
.reccard{position:relative;margin-top:14px;border-radius:18px;padding:16px 16px 14px;background:radial-gradient(120% 140% at 0% 0%,#3a2a5c 0%,#1d2130 55%,#14161f 100%);border:2px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.35);overflow:hidden}
.reccard::after{content:"⚔";position:absolute;right:-6px;bottom:-26px;font-size:110px;opacity:.07}
.rc-title{font-weight:800;font-size:13px;letter-spacing:.04em}
.rc-title span{color:var(--gold)}
.rc-mode{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;background:var(--spell);color:#1d1030;border-radius:999px;padding:2px 10px}
.rc-num{font-size:56px;font-weight:800;line-height:1.1;margin-top:6px;color:var(--gold)}
.rc-num span{font-size:16px;color:var(--text);margin-left:6px}
.rc-sub{font-size:12px;color:var(--sub);font-weight:700}
.rc-name{font-size:15px;font-weight:800;margin-top:2px}
.rc-tag{position:absolute;right:14px;top:14px;font-size:11px;color:#cdb6ff;font-weight:800}
.rc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub)}
.rktabs{display:flex;gap:6px;margin:10px 0 8px}
.rktabs button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);font:inherit;font-weight:700;font-size:12.5px}
.rktabs button.on{background:var(--spell);color:#1d1030;border-color:var(--spell)}
.rk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rk li{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.rk li.me{border-color:var(--me);background:#1d2a40}
.rk .n{width:26px;text-align:center;font-weight:800;font-size:15px;color:var(--sub)}
.rk li:nth-child(1) .n{color:#ffd54d} .rk li:nth-child(2) .n{color:#d6dbe6} .rk li:nth-child(3) .n{color:#e3a36b}
.rk .nm2{flex:1;min-width:0;font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nm2 small{display:block;font-size:10.5px;color:var(--sub);font-weight:700}
.rk .v{font-weight:800;font-size:18px;color:var(--gold);white-space:nowrap}
.rk .v small{font-size:11px;color:var(--text);margin-left:2px}
.rk .del{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;font:inherit;font-size:11px;padding:3px 7px}
.rk .del.arm{border-color:var(--bad);color:var(--bad)}
.rkme{margin-top:10px;background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.7}
.rkme b{color:var(--gold);font-size:15px}
.rkst{font-size:12px;color:var(--sub);margin:4px 0 8px;line-height:1.6}
.rkst.warn{color:var(--warn)}
.login{margin-top:10px;background:var(--panel2);border:1.5px solid var(--me);border-radius:12px;padding:10px 12px}
.gbtn{width:100%;padding:11px 0;border-radius:10px;border:none;background:#fff;color:#222;font:inherit;font-weight:800;font-size:14px}
.linkbtn{background:none;border:none;color:var(--sub);font:inherit;font-size:12px;text-decoration:underline;padding:0 0 0 6px}
.pname button{background:var(--gold);border:none;border-radius:10px;font:inherit;font-weight:800;font-size:13px;padding:8px 12px;color:#222}
.xbtn{display:inline-block;background:#000;color:#fff;border:1px solid #444;border-radius:999px;padding:7px 14px;font-weight:800;font-size:12px;text-decoration:none;white-space:nowrap}
.xbtn.off{opacity:.4;pointer-events:none}
header h1.logo{display:flex;align-items:center;gap:8px;margin:0;line-height:0}
.logo-emblem{width:42px;height:42px;flex:none}
.logo-word{width:83px;height:46px;flex:none}
/* ---- 称号バナー ---- */
.tools button{font-size:12px;white-space:nowrap}
.tools .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:2px;vertical-align:top}
.bn{position:relative;line-height:0}
.bn img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 10px #000a)}
.bn .shine{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;background:linear-gradient(115deg,transparent 40%,#ffffff70 50%,transparent 60%);background-size:300% 100%;animation:shine 3.4s ease-in-out infinite;pointer-events:none;mix-blend-mode:overlay}
@keyframes shine{0%{background-position:130% 0}55%,100%{background-position:-30% 0}}
.bn.lock img{filter:brightness(0) invert(.24);opacity:.9}
.bn .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#ffffff40;line-height:1;letter-spacing:.2em}
.bn.noimg{line-height:1.3;aspect-ratio:2.7;border-radius:14px;border:2px solid var(--line);background:linear-gradient(120deg,#252a3d,#1a1d29);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.bn.noimg img,.bn.noimg .shine{display:none}
.bn .new{position:absolute;top:2px;left:4px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;line-height:1.3;z-index:2}
.blist{display:flex;flex-direction:column;gap:14px;margin:12px 0 6px}
.bcap{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--sub);margin-top:4px;padding:0 6px}
.bcap .cd{font-weight:800;color:var(--gold)}
.bcap .fl{font-style:italic;color:#c9cedb}
.rr.c{color:#c9cedb}.rr.u{color:#dfe5ee}.rr.r{color:#ffd66b}.rr.m{color:#ff9f5a}
.rr{font-weight:800}
.curttl{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.6}
.curttl b{color:var(--gold)}
.getttl{text-align:center;font-size:20px!important;color:var(--gold)}
.getwrap{margin:8px -4px 0}
.getmsg{text-align:center;font-size:13.5px;line-height:1.7;margin-top:12px}
.getmsg b{color:var(--gold)}
.popin{animation:popin .8s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes popin{0%{transform:scale(.4);opacity:0;filter:brightness(3)}60%{opacity:1}100%{transform:scale(1);filter:brightness(1)}}
.getfl{text-align:center;font-size:12px;font-style:italic;color:#c9cedb;margin-top:6px}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btnrow .btn{flex:1}
.tb{display:inline-block;font-size:10px;font-weight:800;padding:0 6px;border-radius:99px;margin-right:5px;background:#3a4057;color:#dfe3ee;vertical-align:1px}
.tb.u{background:#5b6578;color:#fff}.tb.r{background:#8a6716;color:#ffe9a8}.tb.m{background:#a8401a;color:#ffe0c8}
</style>
</head>

// MTG combat drill engine (MVP: vanilla + flying/reach, no new cards, no tricks)

const WIN = 1000;

function canBlock(blk, att) {
  if (att.fly) return blk.fly || blk.reach;

}

// ---------- 戦闘ダメージの共通処理（基本用・インスタント用の両エンジンで使う） ----------
// step: 0 = 先制なしの1回だけ, 1 = 先制ダメージ, 2 = 通常ダメージ（先制の後）

    if (!a.blocked) { toP += a.P; if (a.ll) gainA += a.P; continue; }

function ccAssign(a, L, blk, st) {

  const sumNeed = need.reduce((x, y) => x + y, 0);

  }

    const i = b.target;

  for (let i = 0; i < att.length; i++) {               // 攻撃クリーチャー → ブロッカー／プレイヤー
    const a = att[i];
    if (!st.aAlive[i] || !ccDeals(a, step) || a.P <= 0) continue;
    if (!a.blocked) { toP += a.P; if (a.ll) gainA += a.P; continue; }

    for (let j = 0; j < blk.length; j++) if (blk[j].target === i && st.bAlive[j]) L.push(j);

    choiceLists.push({ i, opts: ccAssign(a, L, blk, st) });

  for (const cl of choiceLists) { const nx = []; for (const c of combos) for (const o of cl.opts) nx.push(c.concat([[cl.i, o]])); combos = nx; }
  return combos.map(combo => {
    const aDmg = st.aDmg.slice(), bDmg = st.bDmg.slice(), aDT = st.aDT.slice(), bDT = st.bDT.slice();
    const aAlive = st.aAlive.slice(), bAlive = st.bAlive.slice();
    let tp = st.toPlayer + toP, gA = st.gain[0] + gainA, gD = st.gain[1] + gainD;
    for (let i = 0; i < att.length; i++) { aDmg[i] += aAdd[i]; if (aDTn[i]) aDT[i] = true; }
    for (const [i, o] of combo) {
      const a = att[i];
      for (const [j, n] of o.to) { if (n <= 0 || blk[j].prev) continue; bDmg[j] += n; if (a.dt) bDT[j] = true; if (a.ll) gA += n; }
      if (o.player) { tp += o.player; if (a.ll) gA += o.player; }

    for (let j = 0; j < blk.length; j++) if (bAlive[j] && !blk[j].ind && (bDmg[j] >= blk[j].T || bDT[j])) bAlive[j] = false;

}
// 複数（または1体）にブロックされた攻撃クリーチャーのダメージの割り振り方

  const P = a.P;
  const need = L.map(j => ccNeed(blk[j], st.bDmg[j], a.dt));
  const sumNeed = need.reduce((x, y) => x + y, 0);
  if (a.tr && P >= sumNeed) return [{ to: L.map((j, k) => [j, need[k]]), player: P - sumNeed }];   // トランプル：全員に致死を割り振って残りを通す
  if (L.length === 1) return [{ to: [[L[0], P]], player: 0 }];
  const kill = L.map(j => !blk[j].ind && !blk[j].prev);
  const n = L.length, feas = [];
  for (let m = 1; m < (1 << n); m++) {
    let s = 0, ok = true;
    for (let k = 0; k < n; k++) if (m >> k & 1) { if (!kill[k]) { ok = false; break; } s += need[k]; }
    if (ok && s <= P) feas.push({ m, s });
  }
  const maxi = feas.filter(x => !feas.some(y => y.m !== x.m && (y.m & x.m) === x.m));
  const res = [];
  for (const { m, s } of maxi) {
    const base = []; for (let k = 0; k < n; k++) if (m >> k & 1) base.push([L[k], need[k]]);
    const left = P - s, others = [];
    for (let k = 0; k < n; k++) if (!(m >> k & 1) && kill[k]) others.push(k);
    if (left > 0 && others.length) for (const k of others) res.push({ to: base.concat([[L[k], left]]), player: 0 });
    else res.push({ to: base, player: 0 });
  }
  if (!res.length) { const k = kill.indexOf(true); res.push({ to: [[L[k >= 0 ? k : 0], P]], player: 0 }); }
  return res;
}
// クリーチャーの盤面価値（評価関数）— 両エンジン共通
function ccValue(c, p, t) {
  return 6 * p + 4 * t + (c.fly ? 4 : 0) + (c.fs ? 3 : 0) + (c.ds ? 6 : 0) + (c.dt ? 4 : 0) + (c.tr ? 2 : 0) + (c.me ? 2 : 0)
    + (c.vg ? 2 : 0) + (c.ll ? 3 : 0) + (c.ind ? 5 : 0) + (c.hx ? 1 : 0) + (c.wd || 0) - (c.df ? 6 : 0);

function makeVanilla(board, maxPly) {   // engine.js の makeSolver と同じ（打ち切りはモジュールの deadline）

  const sides = [board.me, board.op];

  let capHit = false;       // 読みの深さの限界に当たったか
  let nodes = 0;

  function key(st, ply) {

    const attList = attackers.map(i => acs[i]);

      }

  const flat = (c, extra) => Object.assign({ P: c.p, T: c.t, dmg: 0, dt: !!c.dt, tr: !!c.tr, ll: !!c.ll, ind: !!c.ind, prev: false, fs: !!c.fs, ds: !!c.ds, alive: true }, extra);

  // 戦闘の結果（誰が死に、何点通り、何点回復するか）は能力値が変わらないので、攻撃とブロックの組み合わせごとに覚えて使い回す

  function combatOuts(att, attackers, avail, assign) {

    for (let k = 0; k < avail.length; k++) if (assign[k] >= 0) ck += avail[k] + '>' + assign[k] + ',';
    let outs = combatCache.get(ck);

  function attackSubsets(st) {

    const elig = [];
    for (let i = 0; i < cs.length; i++) if ((st.a[att] >> i & 1) && !cs[i].df) elig.push(i);   // 防衛は攻撃できない
    const res = [];
    for (let m = 0; m < (1 << elig.length); m++) {
      const list = [];

      res.push(list);

  // alpha-beta with transposition table. value from 自分's perspective.
  // 局面の値 ＝「攻撃しない」と「いずれかで攻撃する」の良いほう。
  // 相手が攻撃しなかった直後（st.pp）にこちらも攻撃しないと、同じ局面のくり返し（にらみ合い）として決着つかず。
  // 同じ局面では同じ判断をする前提なので、問題の選択肢として選んだ最初の「攻撃しない」も数える。
  function value(st, ply, alpha = -Infinity, beta = Infinity) {

    if (st.life[0] <= 0) return -WIN + ply;

  function bestAttack(st, ply, alpha, beta) {

      else { if (v < best) { best = v; bestSub = s; } if (best < b) b = best; }
      if (a >= b) break;

  function attackValue(st, ply, attackers, alpha = -Infinity, beta = Infinity) {

    if (!attackers.length && st.pp) return heuristic(st);

        else { if (v < ov) ov = v; if (ov < b2) b2 = ov; }
        if (a2 >= b2) break;

        for (const a of attackSubsets(cur)) {

        }

      }
      if (!atk.length && cur.pp) {   // お互いに攻撃しない → にらみ合いで決着つかず

      });
      const blocks = [];
      pick.avail.forEach((b, k) => { if (pick.assign[k] >= 0) blocks.push([b, atk[pick.assign[k]]]); });

  return { value, top, attackValue, rootOptions, line, setDepth, capped: () => capHit, stats: () => ({ nodes, memo: memo.size, memoX: memoX.size }) };
}

// ---------- キーワード付与（生成用） ----------
const KW_POOL_BASIC = [['fs', 3], ['ds', 1], ['dt', 3], ['tr', 3], ['me', 2], ['vg', 3], ['ll', 3], ['ind', 1], ['df', 2]];
const KW_POOL_SPELL = KW_POOL_BASIC.concat([['hx', 2], ['wd', 2]]);
function pickWeighted(pool) {
  const tot = pool.reduce((s, x) => s + x[1], 0);
  let r = Math.random() * tot;
  for (const [k, w] of pool) { if ((r -= w) < 0) return k; }
  return pool[pool.length - 1][0];
}
// c にキーワードを付ける（kwP: 1つ目が付く確率、kwMax: 最大個数）
function addKeywords(c, kwP, kwMax, pool) {
  let n = 0;
  while (n < kwMax && Math.random() < (n === 0 ? kwP : kwP * 0.35)) {
    const k = pickWeighted(pool);
    if (c[k] || (k === 'ds' && c.fs) || (k === 'fs' && c.ds)) continue;
    if (k === 'df' && (c.vg || c.me || c.tr || c.ds || c.p > 3)) continue;
    if (c.df && (k === 'vg' || k === 'me' || k === 'tr' || k === 'ds')) continue;
    if (k === 'wd') c.wd = Math.random() < 0.6 ? 1 : 2; else c[k] = true;
    n++;
  }
  return c;
}

function T(c) { return c.t + c.ctr + c.tt; }

function isInd(c) { return c.ind || c.k.ind; }
function isHex(c) { return c.hex || c.k.hx; }

function kwOf(b) { const k = {}; for (const x of KW_KEYS) if (b[x]) k[x] = b[x]; return k; }
function newCreature(b) {

}
let HC = {};   // 手札のクリーチャー: id('C0'...) → {side, slot, p, t, ..., flash, haste, cost}

function cloneCr(c) {
  return { p: c.p, t: c.t, fly: c.fly, reach: c.reach, k: c.k, alive: c.alive, inHand: c.inHand, sick: c.sick, tap: c.tap,
    ctr: c.ctr, tp: c.tp, tt: c.tt, dmg: c.dmg, dtHit: c.dtHit, fs: c.fs, ind: c.ind, hex: c.hex, prev: c.prev, tfly: c.tfly };
}
function clone(s) {
  return {
    ply: s.ply, act: s.act, life: s.life.slice(), hand: [s.hand[0].slice(), s.hand[1].slice()], lands: s.lands, mana: s.mana.slice(), phase: s.phase,
    quiet: s.quiet, pp: s.pp,
    cr: [s.cr[0].map(cloneCr), s.cr[1].map(cloneCr)],
    atk: s.atk, blk: s.blk ? s.blk.slice() : null,

function inCombat(s, side, i) {

// ---------- state-based actions ----------

  for (let side = 0; side < 2; side++) {
    s.cr[side].forEach((c, i) => {
      if (!c.alive) return;
      const t = T(c);
      if (t <= 0 || ((c.dmg >= t || c.dtHit) && !isInd(c))) { c.alive = false; ev.push({ t: 'die', side, i }); }

}

// ---------- 唱えられる呪文 ----------
// 返り値: [{card, tg, kick, cost}]  tg: [side, idx] または ['P', side]
function castOptions(s, by) {
  const hand = s.hand[by];
  if (!hand.length) return [];

  const seen = new Set();
  for (const id of hand) {
    if (seen.has(id)) continue; seen.add(id);
    if (isCreatureCard(id)) creatureOptions(s, by, id, res);
    else instantOptions(s, by, id, res);
  }
  return res;
}

function creatureOptions(s, by, id, res) {
  const H = HC[id];

  if (!stackEmpty || H.cost > s.mana[by]) return;
  const ph = s.phase;
  if (H.flash) {

    if (by === s.act && (ph === 'w1' || ph === 'w4')) res.push({ card: id, tg: [], cost: H.cost });

}

function wardCost(s, by, tg) {

  for (const t of tg) if (t[0] !== 'P' && t[0] !== by) w += s.cr[t[0]][t[1]].k.wd || 0;

}

function instantOptions(s, by, id, out) {

  if (ph === 'w1' && stackEmpty) return;   // 戦闘前メインの窓は「速攻クリーチャーを唱える」専用
  // タイミングの枝刈り（結果が同じになる重複タイミングを除く）
  const trickTime = !stackEmpty || ph === 'w3' || (id === 'FLIGHT' && ph === 'w2');

  s.cr[by].forEach((c, i) => { if (c.alive) own.push(i); });

      break;
    case 'MOVE':
      for (const i of foe) if (P(s.cr[opp][i]) >= 4) add([[opp, i]], C.cost);

      const c = cr(tg0);

// ---------- 戦闘ダメージ（共通処理 ccCombat を使う） ----------
function combatDamage(s0) {

    if (o.gain[1]) { ns.life[def] += o.gain[1]; ev.push({ t: 'gain', side: def, n: o.gain[1], ll: true }); }

// ---------- flow ----------

}

function openWindow(s, phase) { s.phase = phase; s.win = { prio: s.act, passes: 0, stack: [] }; }

    case 'w2': s.win = null; s.phase = 'blk'; break;
    case 'w3': s.win = null; s.phase = 'dmg'; break;
    case 'w4': endTurn(s, ev); break;
  }

function terminal(s) {

  if (s.life[0] <= 0) return -WIN + s.ply;

}

let vanillaHook = null;

// 決定局面の子：[{ev, s}]

// hc: 手札クリーチャーの定義 [{side, p, t, (キーワード), flash, haste, cost}] → id 'C0','C1'...

// ---------- classification & generation ----------

const LEVELS = {
  easy:   { me: [1, 2], op: [1, 2], life: [2, 7],  flyP: 0.2, tapP: 0.15, handP: [0.5, 0.8], creatureP: [0.2, 0.25], kwP: 0.25, kwMax: 1, maxPly: 60, trickPly: 60 },
  normal: { me: [2, 3], op: [1, 2], life: [2, 9],  flyP: 0.2, tapP: 0.2,  handP: [0.7, 0.8], creatureP: [0.3, 0.3],  kwP: 0.4,  kwMax: 2, maxPly: 60, trickPly: 60, swap: true },
  hard:   { me: [2, 3], op: [2, 3], life: [3, 10], flyP: 0.2, tapP: 0.25, handP: [0.8, 0.8], creatureP: [0.35, 0.3], kwP: 0.5,  kwMax: 2, maxPly: 60, trickPly: 60, maxTotal: 5 },

function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  const p = rint(1, 5);

// 手札のクリーチャー（速攻か瞬速）。コストはP/Tとキーワードから決める

  const p = rint(1, 4), t = rint(1, 4);

  c.haste = !c.flash;
  let nk = 0;
  if (Math.random() < 0.4) { const k = pickWeighted(HAND_KW); c[k] = true; nk = 1; }

  const depths = DEPTHS2.filter(d => d < maxPly).concat([maxPly]);

  let opts = null;

  const hc = spec.hc || [];
  const nm = board.me.length, no = board.op.length;

  let depth = Infinity;
  const lineOfs = [];
  const per = scen.map(h => {
    const r = tp ? rootOptions(board, life, [hand[0], h ? [h] : []], lands, tapped, BASE_PLY, tp, hc, 0, true)

    const ev = cells.reduce((s, c, i) => s + c.score * probs[i] / 100, 0);

function randBoard(L) {
  let nm = rint(L.me[0], L.me[1]), no = rint(L.op[0], L.op[1]);
  if (L.swap && Math.random() < 0.5) [nm, no] = [no, nm];
  if (L.maxTotal && nm + no > L.maxTotal) { if (Math.random() < 0.5) nm--; else no--; }
  const board = { me: [], op: [] };
  for (let i = 0; i < nm; i++) board.me.push(randCreature(L.flyP, L.kwP, L.kwMax));
  for (let i = 0; i < no; i++) board.op.push(randCreature(L.flyP, L.kwP, L.kwMax));
  board.me.sort((a, b) => b.p - a.p || b.t - a.t);
  board.op.sort((a, b) => b.p - a.p || b.t - a.t);
  let tapped = 0;
  if (Math.random() < L.tapP) for (let i = 0; i < no; i++) if (Math.random() < 0.5 && !board.op[i].df) tapped |= 1 << i;
  if (tapped === (1 << no) - 1) tapped = 0;

  if (!bankMap) { bankMap = new Map(); LEVELS.forEach(l => (BANK[l] || []).forEach(p => { p.mode = 'read'; bankMap.set(encode(p), p); })); }
  const p = bankMap.get(id);
  return p ? JSON.parse(JSON.stringify(p)) : null;
}
function setHash(id) { try { if (location.hash !== '#' + id) location.hash = id; } catch (e) {} }

// ---------- 出題 ----------
function k(m, l) { return m + ':' + l; }
function prefetch(m, l) { if (m !== 'read' && !next[k(m, l)]) next[k(m, l)] = call({ type: 'gen', mode: m, level: l }); }
function fromBank(l) {
  const list = BANK[l] || [];
  const idOf = i => encode(Object.assign({}, list[i], { mode: 'read' }));
  const unseen = list.map((_, i) => i).filter(i => !seen[l].includes(idOf(i)));
  if (!unseen.length) return null;
  const i = unseen[Math.floor(Math.random() * unseen.length)];
  seen[l].push(idOf(i)); store.set('cd_seen_read2', seen);
  const p = JSON.parse(JSON.stringify(list[i])); p.mode = 'read';
  return p;
}
function setPuzzle(p, fresh = true) {
  puzzle = p; p.mode = p.mode || mode; p.id = encode(p); p.fresh = fresh && !reviewing;
  if (p.fresh && p.level === 'hard') { pending[p.mode] = p.id; store.set('cd_pending', pending); }
  curRec = { id: p.id, fresh: p.fresh, answered: false }; store.set('cd_cur', curRec);
  sel = new Set(); castSel = null; answered = false; viewIdx = -1; viewCell = null; lineOpen = false; showCard = -1;
  setHash(p.id);
  render();

}
// 読み筋（解説）を、問題を出した後に作ってもらう（作り終えたら答え合わせの画面を描き直す）
function requestLines(p) {
  if (!p.lineTok) return;
  const tok = p.lineTok; delete p.lineTok;
  call({ type: 'lines', tok }).then(ls => {
    if (!ls) return;
    p.opts.forEach((o, i) => { if (p.mode === 'read') o.cells.forEach((c, si) => { c.line = ls[i][si]; }); else o.line = ls[i]; });
    if (puzzle === p && answered) render();

}
function loading(msg) { app.innerHTML = `<div class="loading">${msg}</div>`; }
async function newPuzzle() {
  if (level === 'hard' && !reviewing && pending[mode]) {
    const id = pending[mode];
    if (await loadId(id, true)) return;
    delete pending[mode]; store.set('cd_pending', pending);
  }
  const tok = ++loadToken;
  if (mode === 'read') {
    const b = fromBank(level);
    if (b) { setPuzzle(b); return; }
    loading('問題を作成中…<br><small>（同梱の問題を解き終えたので新しく作っています。候補ごとに全探索するため、少し時間がかかります）</small>');
    const p = await call({ type: 'gen', mode: 'read', level });
    if (tok !== loadToken) return;
    return p ? setPuzzle(p) : loading('問題を作れませんでした。もう一度お試しください。');
  }
  loading(`問題を作成中…${mode === 'fdn' ? '<br><small>（インスタントの読み合いを全探索しています）</small>' : ''}`);
  const m = mode, l = level;
  if (!next[k(m, l)]) next[k(m, l)] = call({ type: 'gen', mode: m, level: l });
  const p = await next[k(m, l)]; next[k(m, l)] = null;
  if (tok !== loadToken) { prefetch(m, l); return; }
  if (!p) { prefetch(m, l); loading('問題を作れませんでした。もう一度お試しください。'); return; }
  setPuzzle(p);
  prefetch(m, l);   // 読み筋づくり（setPuzzle で依頼）の後に、次の問題を作る
}
async function loadId(id, fresh) {
  const fromNew = fresh === true;   // newPuzzle（むずかしいの途中の問題）から
  // 出題できないID：むずかしいの途中の問題・復習リストから外し、次の問題に進む
  const skip = msg => {
    for (const m of MODES) if (pending[m] === id) { delete pending[m]; store.set('cd_pending', pending); }
    const i = review.findIndex(r => r.id === id); if (i >= 0) { review.splice(i, 1); saveReview(); }
    if (reviewing) {
      if (review.length) return loadId(review[0].id);
      reviewing = false; toast('復習完了！'); newPuzzle(); return true;
    }
    if (fromNew) return false;   // 呼び出し元が新しい問題を作る
    toast(msg); newPuzzle(); return true;
  };
  const spec = decode(id);
  if (!spec) return skip('この問題IDは読み込めないため、新しい問題を出します');   // 書き換えたID・古い形式のID
  if (fresh === undefined) fresh = !reviewing && (pending[spec.mode] === id || (curRec.id === id && curRec.fresh && !curRec.answered));
  const tok = ++loadToken;
  if (mode !== spec.mode || level !== spec.level) { mode = spec.mode; level = spec.level; store.set('cd_mode', mode); store.set('cd_level', level); renderSeg(); renderScore(); }
  if (spec.mode === 'read') { const b = bankLookup(id); if (b) { setPuzzle(b, fresh); return true; } }
  loading('問題IDから盤面を復元して解いています…');
  const p = await call({ type: 'solve', mode: spec.mode, spec });
  if (tok !== loadToken) return true;
  if (p && p.noWin) return skip('この盤面には勝てる手がないため、新しい問題を出します');   // 勝てる手がない盤面
  if (!p) { loading('この問題IDは読み込めませんでした。'); return false; }
  setPuzzle(p, fresh);
  return true;
}

// ---------- 復習 ----------
function saveReview() { store.set('cd_review', review); document.getElementById('revN').textContent = review.length; }
function startReview() {
  if (!review.length) { toast('復習する問題はありません（間違えた問題がここにたまります）'); return; }
  reviewing = true; loadId(review[0].id);
}
function stopReview() { reviewing = false; newPuzzle(); }

// ---------- text helpers ----------
const sideName = s => s === 0 ? 'あなた' : '相手';
const KW_LABEL = [['fly', '飛行'], ['reach', '到達'], ['fs', '先制攻撃'], ['ds', '二段攻撃'], ['dt', '接死'], ['tr', 'トランプル'], ['me', '威迫'], ['vg', '警戒'], ['ll', '絆魂'], ['ind', '破壊不能'], ['df', '防衛'], ['hx', '呪禁'], ['wd', '護法'], ['hs', '速攻']];
const KW_DESC = { '飛行': '飛行か到達を持つクリーチャーでしかブロックされない', '到達': '飛行クリーチャーをブロックできる', '先制攻撃': '通常より先にダメージを与える', '二段攻撃': '先制ダメージと通常ダメージの2回ダメージを与える',
  '接死': '1点でもダメージを与えたクリーチャーを破壊する（割り振りは1点で致死扱い）', 'トランプル': 'ブロッカーに致死ダメージを割り振った残りをプレイヤーに与えられる', '威迫': '2体以上でないとブロックできない', '警戒': '攻撃してもタップしない（相手のターンにブロックできる）',
  '絆魂': '与えたダメージぶんライフを得る', '破壊不能': 'ダメージや「破壊する」で死なない（タフネス0以下なら死ぬ）', '防衛': '攻撃できない', '呪禁': '相手の呪文の対象にならない', '護法': '相手の呪文の対象にするには、追加で{N}を払う必要がある', '速攻': '戦場に出たターンから攻撃できる' };
function kwList(c) { const r = []; for (const [k, l] of KW_LABEL) if (c[k]) r.push(k === 'wd' ? `護法{${c.wd}}` : l); return r; }
const isCre = id => !!id && id[0] === 'C';
const hcd = id => puzzle.hc[+id.slice(1)];
function slotOf(id) { const d = hcd(id); let n = d.side === 0 ? puzzle.board.me.length : puzzle.board.op.length; for (const x of puzzle.hc) { if (x === d) break; if (x.side === d.side) n++; } return n; }
function allCr(side) { const P = puzzle; const r = (side ? P.board.op : P.board.me).slice(); for (const d of P.hc || []) if (d.side === side) r.push(d); return r; }
function creName(d) { const k = kwList(d).filter(x => x !== '速攻'); return `${d.haste ? '速攻' : '瞬速'}クリーチャー ${d.p}/${d.t}${k.length ? '・' + k.join('・') : ''}`; }
const cname = id => isCre(id) ? `《${creName(hcd(id))}》` : `《${CARDS[id].ja}》`;
const cshort = id => isCre(id) ? `${hcd(id).haste ? '速攻' : '瞬速'}${hcd(id).p}/${hcd(id).t}` : CARDS[id].ja;
const cmana = id => isCre(id) ? `{${hcd(id).cost}}` : CARDS[id].mana;
const scenShort = h => h ? cname(h) : '基本土地';
function kwHtml(c) { return kwList(c).map(l => `<span class="chip ${l === '飛行' ? 'fly' : l === '到達' ? 'reach' : l === '速攻' ? 'k3' : 'k2'}">${l}</span>`).join(''); }
function kwGlossary() {
  const seen = new Set();
  for (const side of [0, 1]) for (const c of allCr(side)) for (const l of kwList(c)) seen.add(l.startsWith('護法') ? '護法' : l);
  if (!seen.size) return '';
  return '<div class="kwgl"><b>この盤面のキーワード</b><br>' + [...seen].map(l => `・<b>${l}</b>：${KW_DESC[l]}`).join('<br>') + '</div>';
}
function creText(id) {
  const d = hcd(id);
  const base = d.haste ? '速攻：戦場に出たターンから攻撃できる。自分のメインフェイズに唱える（戦闘前に出すかは「戦闘前に唱える」ボタンで選ぶ）'
    : '瞬速：インスタントと同じタイミングで唱えられる（相手の攻撃中に出してブロック、など）。出たターンは攻撃できない';
  const k = kwList(d).filter(x => x !== '速攻');

}

function cardHtml(c, side, i, extra) {
  return `<div class="card ${extra || ''}" data-i="${i}"><div><div class="id">${NM[side][i]}</div><div class="kw">${kwHtml(c)}</div></div><div class="pt">${c.p}/${c.t}</div></div>`;
}
function atkLabel(arr) { return arr.length ? arr.map(i => NM[0][i]).join('・') + ' で攻撃' : '攻撃しない'; }
function optLabel(o) { return (o.cast ? `${NM[0][slotOf(o.cast)]}を唱えて ` : '') + atkLabel(o.attackers); }
function optShort(o) { return (o.cast ? `${NM[0][slotOf(o.cast)]}唱え＋` : '') + (o.attackers.length ? o.attackers.map(i => NM[0][i]).join('・') : '攻撃なし'); }
const optMatch = (o, cast, mine) => (o.cast || null) === (cast || null) && sameSet(o.attackers, mine);
function outLabel(c) {
  if (c.cls === 'win') return c.mine ? (c.n === 1 ? 'このターンで勝ち' : `自分の${c.n}ターン目に勝ち`) : `相手の${c.n}ターン目中に勝ち`;
  if (c.cls === 'loss') return c.mine ? `自分の${c.n}ターン目中に負け` : `相手の${c.n}ターン目に負け`;

const MARK = { best: '◎', slow: '○', open: '△', loss: '×' };
const sameSet = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const pct = x => Math.round(x * 100) + '%';
function castable(side, id) {
  if (!id) return false;

// ---------- 展開表示 ----------
function lineHtml(line, outcome) {
  if (!line) return '<div class="idle">読み筋を計算中…</div>';
  const P = puzzle;
  const cr = [allCr(0), allCr(1)];
  const nb = [P.board.me.length, P.board.op.length];
  const alive = cr.map((a, sd) => a.map((_, i) => i < nb[sd])), ctr = cr.map(a => a.map(() => 0));
  const shown = alive.map(a => a.slice());
  const life = P.life.slice();
  const dn = (side, i) => NM[side][i >= nb[side] && P.mode === 'read' && side === 1 ? nb[1] : i];
  const mentioned = new Set();
  const nm = (side, i) => {
    const key = side + ':' + i, c = cr[side][i];
    let s = dn(side, i);
    if (!mentioned.has(key)) { mentioned.add(key); s += `<small>(${c.p + ctr[side][i]}/${c.t + ctr[side][i]})</small>`; }
    return `<span class="nm">${s}</span>`;
  };
  const tgName = t => t[0] === 'P' ? sideName(t[1]) : nm(t[0], t[1]);
  // turn blocks
  const blocks = []; let cur = { side: 0, n: 1, ev: [] }; const cnt = [1, 0];
  for (const e of line) { if (e.t === 'turn') { blocks.push(cur); cnt[e.act]++; cur = { side: e.act, n: cnt[e.act], ev: [] }; } else cur.ev.push(e); }
  blocks.push(cur);
  const active = b => b.ev.some(e => ['cast', 'die', 'face', 'gain', 'blk'].includes(e.t) || (e.t === 'atk' && e.mask));
  const mini = () => {
    const row = side => cr[side].map((c, i) => shown[side][i] ? `<span class="mc2 ${alive[side][i] ? '' : 'dead'}">${dn(side, i)}${c.p + ctr[side][i]}/${c.t + ctr[side][i]}${kwList(c).length ? '<i>' + kwList(c).map(l => l.slice(0, 2)).join('') + '</i>' : ''}</span>` : '').join('');
    return `<div class="mini"><div class="r"><span class="ms o">敵</span>${row(1)}</div><div class="r"><span class="ms m">自</span>${row(0)}</div></div>`;
  };
  let html = '', idleRun = 0, idleNote = '', idleFirst = null;
  const flushIdle = () => {
    if (!idleRun) return;
    const label = idleRun === 1 ? `${idleFirst.side === 0 ? 'あなた' : '相手'}の${idleFirst.n}ターン目：<b>攻撃なし</b>` : `お互い<b>攻撃なし</b>（${idleRun}手番）`;
    html += `<div class="idle">${idleNote}${label}</div>`; idleRun = 0; idleNote = ''; idleFirst = null;
  };
  const stack = [];
  for (let bi = 0; bi < blocks.length; bi++) {
    const b = blocks[bi];
    const note = b.ev.some(e => e.t === 'approx') ? '<span class="note">※ここから先は、残った手札を考慮しない近似で読んでいます</span><br>' : '';
    if (!active(b)) {
      if (!blocks.slice(bi).some(active)) { flushIdle(); html += `${note ? `<div class="idle">${note}</div>` : ''}<div class="end open">以降はお互いに動けず、膠着します</div>`; return html; }
      if (!idleRun) idleFirst = b;
      idleRun++; idleNote = idleNote || note; continue;
    }
    flushIdle();
    const lines = [];
    let decisive = false;
    for (const e of b.ev) {
      switch (e.t) {
        case 'atk': lines.push(e.mask ? [0, 1, 2, 3, 4, 5, 6, 7].filter(i => e.mask >> i & 1).map(i => nm(e.side, i)).join('・') + ' で攻撃' : '攻撃しない'); break;
        case 'blk': {
          if (!e.pairs.length) { lines.push('<span class="d">ブロックなし</span>'); break; }
          const by = {};
          e.pairs.forEach(([bb, a]) => { (by[a] = by[a] || []).push(nm(1 - b.side, bb)); });
          lines.push('<span class="d">' + Object.keys(by).map(a => `${by[a].join('＋')} が ${nm(b.side, +a)} をブロック`).join('、') + '</span>');
          break;
        }
        case 'cast': stack.push(e); lines.push(`<span class="sp">${e.resp ? '↳ 対応して ' : ''}${sideName(e.by)}：${cname(e.c)}${e.kick ? '（キッカー）' : ''}${e.tg.length ? ' → ' + e.tg.map(tgName).join('・') : 'を唱える'}</span>`); break;
        case 'enter': alive[e.side][e.i] = true; shown[e.side][e.i] = true; lines.push(`<span class="sp">${nm(e.side, e.i)} が戦場に出た</span>`); break;
        case 'resolve': { const x = stack.pop(); if (x && (x.c === 'FLIGHT' || x.c === 'VEIL')) { const t = x.tg[0]; if (alive[t[0]][t[1]]) ctr[t[0]][t[1]]++; } break; }
        case 'fizzle': stack.pop(); lines.push(`<span class="fz">${cname(e.c)} は対象が不適正になり立ち消え</span>`); break;
        case 'die': lines.push(`<span class="d">死亡：${nm(e.side, e.i)}</span>`); alive[e.side][e.i] = false; break;
        case 'face': life[e.side] -= e.n; lines.push(`<span class="d">${sideName(e.side)}に ${e.n} 点${e.combat ? '' : '（呪文）'}</span>`); if (life[e.side] <= 0) decisive = true; break;
        case 'gain': life[e.side] += e.n; lines.push(`<span class="d">${sideName(e.side)}は${e.ll ? '絆魂で' : ''} ${e.n} 点回復</span>`); break;
      }
    }
    html += `<div class="step s${b.side} ${decisive ? 'key' : ''}"><span class="lv">自 ${Math.max(0, life[0])} / 敵 ${Math.max(0, life[1])}</span><div class="h">${b.side === 0 ? 'あなた' : '相手'}の${b.n}ターン目${decisive ? '<span class="keytag">決着</span>' : ''}</div>${note}${lines.map(l => `<div>${l}</div>`).join('')}${mini()}</div>`;
  }
  flushIdle();
  if (blocks.some(b => b.ev.some(e => e.t === 'cut'))) html += `<div class="idle">…（ここから先の読み筋は長いので省略）</div>`;
  if (outcome.cls === 'win') html += `<div class="end win">→ 相手のライフが0に。勝ち！</div>`;
  else if (outcome.cls === 'loss') html += `<div class="end loss">→ あなたのライフが0に。負け</div>`;
  else if (blocks.some(b => b.ev.some(e => e.t === 'loop'))) html += `<div class="end open">→ 同じ局面のくり返し（にらみ合い）になり、決着つかず（盤面の評価で比較）</div>`;
  else html += `<div class="end open">→ ${puzzle.maxPly / 2}往復以内には決着つかず（その時点の盤面の評価で比較）</div>`;
  return html;
}

// ---------- 手札表示 ----------

  return `<div class="handrow"><span class="hc">手札 <b>${hand.length}</b>枚</span>${hand.map((id, k) => `<span class="spell ${castable(side, id) ? '' : 'cant'}" data-card="${side}:${k}">${isCre(id) ? (hcd(id).haste ? '⚡' : '🌀') + cshort(id) : cname(id)}<span class="mc">${cmana(id)}</span></span>`).join('')}</div>${lands}`;
}
function cardTextHtml(side) {
  if (typeof showCard !== 'string' || !showCard.startsWith(side + ':')) return '';

  else if (side === 0 && puzzle.hand[0].length > 1) warn = '<div class="warn">土地は手札のどちらか1枚分しかありません（両方は唱えられない）</div>';
  else if (id === 'BURST' && L >= 5) warn = '<div class="warn">土地5枚：キッカーを払って4点にできます</div>';

  else if (id === 'REBUKE' && L < 5) warn = '<div class="warn">土地が5枚未満：タップ状態のクリーチャーにだけ唱えられます</div>';
  if (isCre(id)) return `<div class="cardtext show"><div class="nm">${cname(id)} <span class="en">${cmana(id)}・クリーチャー</span></div>${creText(id)}${warn}</div>`;
  const C = CARDS[id];
  return `<div class="cardtext show"><div class="nm">${cname(id)} <span class="en">${C.en}・${C.mana}・インスタント</span></div>${C.desc}${warn}</div>`;
}

function hasteInHand() { return (puzzle.hand[0] || []).find(id => isCre(id) && hcd(id).haste && castable(0, id)); }

// ---------- 問題画面 ----------
function render() {
  const P = puzzle, B = P.board;
  const read = P.mode === 'read', fdn = P.mode !== 'basic';
  let html = reviewing ? `<div class="revbar"><span>📚 復習中（残り${review.length}問）</span><button id="revStop">やめる</button></div>`
    : !P.fresh ? `<div class="linkbar">🔗 リンクから開いた問題です（成績・連続記録の対象外）</div>` : '';

function submit() {
  const mine = [...sel].sort((a, b) => a - b);
  const you = puzzle.opts.find(o => optMatch(o, castSel, mine));
  if (!you) { toast('その組み合わせは選べません'); return; }
  if (!puzzle.scored) {
    puzzle.scored = true;
    const ok = you.grade === 'best' || you.grade === 'slow';   // ○（惜しい）も正解扱い
    if (reviewing) {
      const idx = review.findIndex(r => r.id === puzzle.id);
      if (idx >= 0) { const [it] = review.splice(idx, 1); if (!ok) review.push(it); }
      saveReview();
    } else {
      if (puzzle.fresh) {
        const st = stats[puzzle.mode][puzzle.level];
        st.n++;
        if (ok) { st.best++; st.streak++; st.top = Math.max(st.top, st.streak); }
        else { if (you.grade === 'slow') st.slow++; st.streak = 0; }
        store.set('cd_stats3', stats);
        if (puzzle.level === 'hard') {
          if (pending[puzzle.mode] === puzzle.id) { delete pending[puzzle.mode]; store.set('cd_pending', pending); }
          const br = bestRec[puzzle.mode];
          if (ok && st.streak > br.best) {

            store.set('cd_best', bestRec);
            setTimeout(() => toast(`🏆 自己ベスト更新！ ${MODE_JA[puzzle.mode]}・むずかしい 連続${br.best}問`), 400);

      if (!ok && !review.some(r => r.id === puzzle.id)) { review.push({ id: puzzle.id }); if (review.length > 100) review.shift(); saveReview(); }
      renderScore();
    }

  if (curRec.id === puzzle.id) { curRec.answered = true; store.set('cd_cur', curRec); }
  render();
  const r = document.querySelector('.result');
  if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

  document.getElementById('score').innerHTML = `${MODE_JA[mode]}・${LEVEL_JA[level]}<br>正解 <b>${st.best}</b>/${st.n}（${p}%）連続 <b>${st.streak}</b>${extra}`;

    b.classList.toggle('on', b.dataset.m === mode);
    b.onclick = () => { if (mode === b.dataset.m && !reviewing) return; reviewing = false; mode = b.dataset.m; store.set('cd_mode', mode); renderSeg(); renderScore(); newPuzzle(); };
  });
}
document.getElementById('reset').onclick = () => { MODES.forEach(m => LEVELS.forEach(l => { stats[m][l] = emptyStats(); })); store.set('cd_stats3', stats); renderScore(); toast('成績をリセットしました（連続正解の自己ベストは残ります）'); };
document.getElementById('revBtn').onclick = startReview;
document.getElementById('statBtn').onclick = showStats;
document.getElementById('recBtn').onclick = () => showRanking(false);
document.getElementById('cardBtn').onclick = showCards;
window.addEventListener('hashchange', () => {
  const h = (location.hash || '').slice(1);
  if (h && (!puzzle || h !== puzzle.id)) loadId(h);
});

window.__cd = { get puzzle() { return puzzle; }, encode, decode };
renderSeg(); renderScore(); saveReview(); grantCards(topBest());
if (!HOSTED) ensureRanking();
const h0 = (location.hash || '').slice(1);
if (h0) loadId(h0); else newPuzzle();
})();
</script>
</body>
