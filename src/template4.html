<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--HEAD_EXTRA-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>殴り算（BeatMath）｜MTGコンバットクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/*BASECSS*/
.chip.k2{background:#4a3a1e;color:#ffe2a8}
.chip.k3{background:#3b2350;color:#ecd2ff}
.card .kw{flex-direction:row;flex-wrap:wrap;gap:2px}
.card .kw .chip{font-size:9px;padding:0 4px;line-height:1.5}
.card.newc{border-style:dashed;border-color:#b98cff}
.card.dfc{opacity:.75}
.castbtn{display:block;margin:8px auto 0;padding:7px 12px;border-radius:999px;border:1.5px dashed #b98cff;background:transparent;color:#e6d6ff;font:inherit;font-weight:800;font-size:12px}
.castbtn.on{background:#b98cff;color:#1d1030;border-style:solid}
.kwgl{margin-top:4px}
.kwgl b{color:var(--text)}
.tools{display:flex;gap:6px;margin-bottom:10px}
.tools button{flex:1;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:700;font-size:12.5px}
.tools button b{color:var(--gold)}
.revbar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,201,77,.12);border:1.5px solid var(--gold);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:800}
.revbar button{background:none;border:none;color:var(--sub);font:inherit;font-size:12px;text-decoration:underline}
.sec-title.tog{cursor:pointer;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:16px 0 8px}
.sec-title.tog .arrow{font-size:12px;color:var(--sub);white-space:nowrap}
.sec-title.tog .lbl{min-width:0}
.step.key{border:2px solid var(--gold);border-radius:12px;padding:9px 10px;margin:6px -6px;background:rgba(255,201,77,.07)}
.keytag{display:inline-block;background:var(--gold);color:#222;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.idle{padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px;color:var(--sub)}
.idle b{color:var(--text)}
.nm small{font-size:10px;color:var(--sub);font-weight:700;margin-left:1px}
.mini{margin-top:6px;background:#151826;border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;gap:3px}
.mini .r{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.mini .ms{font-size:10px;font-weight:800;width:16px}
.mini .ms.o{color:var(--op)} .mini .ms.m{color:var(--me)}
.mc2{font-size:11px;font-weight:800;background:var(--panel2);border-radius:6px;padding:1px 6px;color:var(--text)}
.mc2 i{font-style:normal;font-size:9px;color:#9fd0ff;margin-left:2px}
.mc2.dead{opacity:.35;text-decoration:line-through}
.share{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.share .sid{font-size:11px;color:var(--sub);word-break:break-all}
.share code{font-size:11px;color:var(--text)}
.sbtns{display:flex;gap:6px;margin-top:8px}
.sbtns button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-weight:700;font-size:12px}
.copybox{width:100%;height:150px;margin-top:8px;background:#0e1018;color:var(--text);border:1px solid var(--line);border-radius:10px;font:12px/1.6 "M PLUS Rounded 1c",sans-serif;padding:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 14px 28px;border-top:3px solid var(--gold)}
.sheet h2{font-size:16px;margin:0 0 10px}
.stbl{width:100%;border-collapse:collapse;font-size:12.5px}
.stbl th{color:var(--sub);font-weight:700;font-size:11px;padding:6px 2px;text-align:center}
.stbl td{text-align:center;padding:8px 2px;border-top:1px solid var(--line)}
.stbl td:first-child{text-align:left;font-weight:800}
.stbl small{display:block;color:var(--sub);font-size:10px}
.sheet .close{margin-top:14px;width:100%}
.sheet{max-height:88vh;overflow:auto}
.linkbar{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:7px 12px;margin-bottom:10px;font-size:12px;color:var(--sub)}
.pname{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:12px;color:var(--sub);font-weight:700}
.pname input{flex:1;min-width:0;background:#0e1018;border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:8px 10px}
.reccard{position:relative;margin-top:14px;border-radius:18px;padding:16px 16px 14px;background:radial-gradient(120% 140% at 0% 0%,#3a2a5c 0%,#1d2130 55%,#14161f 100%);border:2px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.35);overflow:hidden}
.reccard::after{content:"⚔";position:absolute;right:-6px;bottom:-26px;font-size:110px;opacity:.07}
.rc-title{font-weight:800;font-size:13px;letter-spacing:.04em}
.rc-title span{color:var(--gold)}
.rc-mode{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;background:var(--spell);color:#1d1030;border-radius:999px;padding:2px 10px}
.rc-num{font-size:56px;font-weight:800;line-height:1.1;margin-top:6px;color:var(--gold)}
.rc-num span{font-size:16px;color:var(--text);margin-left:6px}
.rc-sub{font-size:12px;color:var(--sub);font-weight:700}
.rc-name{font-size:15px;font-weight:800;margin-top:2px}
.rc-tag{position:absolute;right:14px;top:14px;font-size:11px;color:#cdb6ff;font-weight:800}
.rc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub)}
.rktabs{display:flex;gap:6px;margin:10px 0 8px}
.rktabs button{flex:1;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);font:inherit;font-weight:700;font-size:12.5px}
.rktabs button.on{background:var(--spell);color:#1d1030;border-color:var(--spell)}
.rk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rk li{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.rk li.me{border-color:var(--me);background:#1d2a40}
.rk .n{width:26px;text-align:center;font-weight:800;font-size:15px;color:var(--sub)}
.rk li:nth-child(1) .n{color:#ffd54d} .rk li:nth-child(2) .n{color:#d6dbe6} .rk li:nth-child(3) .n{color:#e3a36b}
.rk .nm2{flex:1;min-width:0;font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nm2 small{display:block;font-size:10.5px;color:var(--sub);font-weight:700}
.rk .v{font-weight:800;font-size:18px;color:var(--gold);white-space:nowrap}
.rk .v small{font-size:11px;color:var(--text);margin-left:2px}
.rk .del{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;font:inherit;font-size:11px;padding:3px 7px}
.rk .del.arm{border-color:var(--bad);color:var(--bad)}
.rkme{margin-top:10px;background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.7}
.rkme b{color:var(--gold);font-size:15px}
.rkst{font-size:12px;color:var(--sub);margin:4px 0 8px;line-height:1.6}
.rkst.warn{color:var(--warn)}
.login{margin-top:10px;background:var(--panel2);border:1.5px solid var(--me);border-radius:12px;padding:10px 12px}
.gbtn{width:100%;padding:11px 0;border-radius:10px;border:none;background:#fff;color:#222;font:inherit;font-weight:800;font-size:14px}
.linkbtn{background:none;border:none;color:var(--sub);font:inherit;font-size:12px;text-decoration:underline;padding:0 0 0 6px}
.pname button{background:var(--gold);border:none;border-radius:10px;font:inherit;font-weight:800;font-size:13px;padding:8px 12px;color:#222}
.xbtn{display:inline-block;background:#000;color:#fff;border:1px solid #444;border-radius:999px;padding:7px 14px;font-weight:800;font-size:12px;text-decoration:none;white-space:nowrap}
.xbtn.off{opacity:.4;pointer-events:none}
header h1.logo{display:flex;align-items:center;gap:8px;margin:0;line-height:0}
.logo-emblem{width:42px;height:42px;flex:none}
.logo-word{width:83px;height:46px;flex:none}
</style>
</head>

      switch (e.t) {
        case 'atk': lines.push(e.mask ? [0, 1, 2, 3, 4, 5, 6, 7].filter(i => e.mask >> i & 1).map(i => nm(e.side, i)).join('・') + ' で攻撃' : '攻撃しない'); break;
        case 'blk': {
          if (!e.pairs.length) { lines.push('<span class="d">ブロックなし</span>'); break; }
          const by = {};
          e.pairs.forEach(([bb, a]) => { (by[a] = by[a] || []).push(nm(1 - b.side, bb)); });
          lines.push('<span class="d">' + Object.keys(by).map(a => `${by[a].join('＋')} が ${nm(b.side, +a)} をブロック`).join('、') + '</span>');
          break;
        }
        case 'cast': stack.push(e); lines.push(`<span class="sp">${e.resp ? '↳ 対応して ' : ''}${sideName(e.by)}：${cname(e.c)}${e.kick ? '（キッカー）' : ''}${e.tg.length ? ' → ' + e.tg.map(tgName).join('・') : 'を唱える'}</span>`); break;
        case 'enter': alive[e.side][e.i] = true; shown[e.side][e.i] = true; lines.push(`<span class="sp">${nm(e.side, e.i)} が戦場に出た</span>`); break;
        case 'resolve': { const x = stack.pop(); if (x && (x.c === 'FLIGHT' || x.c === 'VEIL')) { const t = x.tg[0]; if (alive[t[0]][t[1]]) ctr[t[0]][t[1]]++; } break; }
        case 'fizzle': stack.pop(); lines.push(`<span class="fz">${cname(e.c)} は対象がいなくなり立ち消え</span>`); break;
        case 'die': lines.push(`<span class="d">死亡：${nm(e.side, e.i)}</span>`); alive[e.side][e.i] = false; break;
        case 'face': life[e.side] -= e.n; lines.push(`<span class="d">${sideName(e.side)}に ${e.n} 点${e.combat ? '' : '（呪文）'}</span>`); if (life[e.side] <= 0) decisive = true; break;
        case 'gain': life[e.side] += e.n; lines.push(`<span class="d">${sideName(e.side)}は${e.ll ? '絆魂で' : ''} ${e.n} 点回復</span>`); break;
      }
    }
    html += `<div class="step s${b.side} ${decisive ? 'key' : ''}"><span class="lv">自 ${Math.max(0, life[0])} / 敵 ${Math.max(0, life[1])}</span><div class="h">${b.side === 0 ? 'あなた' : '相手'}の${b.n}ターン目${decisive ? '<span class="keytag">決着</span>' : ''}</div>${note}${lines.map(l => `<div>${l}</div>`).join('')}${mini()}</div>`;
  }
  flushIdle();
  if (blocks.some(b => b.ev.some(e => e.t === 'cut'))) html += `<div class="idle">…（ここから先の読み筋は長いので省略）</div>`;
  if (outcome.cls === 'win') html += `<div class="end win">→ 相手のライフが0に。勝ち！</div>`;
  else if (outcome.cls === 'loss') html += `<div class="end loss">→ あなたのライフが0に。負け</div>`;
  else if (blocks.some(b => b.ev.some(e => e.t === 'loop'))) html += `<div class="end open">→ 同じ局面のくり返し（にらみ合い）になり、決着つかず（盤面の評価で比較）</div>`;
  else html += `<div class="end open">→ ${puzzle.maxPly / 2}往復以内には決着つかず（その時点の盤面の評価で比較）</div>`;
  return html;
}

// ---------- 手札表示 ----------
function handHtml(side) {
  const hand = puzzle.hand[side];
  const lands = `<span class="lands">土地 <b>${puzzle.lands[side]}</b></span>`;
  if (!hand.length) return `<div class="handrow"><span class="hc">手札 <b>0</b>枚</span></div>${lands}`;
  return `<div class="handrow"><span class="hc">手札 <b>${hand.length}</b>枚</span>${hand.map((id, k) => `<span class="spell ${castable(side, id) ? '' : 'cant'}" data-card="${side}:${k}">${isCre(id) ? (hcd(id).haste ? '⚡' : '🌀') + cshort(id) : cname(id)}<span class="mc">${cmana(id)}</span></span>`).join('')}</div>${lands}`;
}
function cardTextHtml(side) {
  if (typeof showCard !== 'string' || !showCard.startsWith(side + ':')) return '';
  const id = puzzle.hand[side][+showCard.split(':')[1]]; if (!id) return '';
  const L = puzzle.lands[side];
  let warn = '';
  if (!castable(side, id)) warn = '<div class="warn">マナが足りないので唱えられません</div>';
  else if (side === 0 && puzzle.hand[0].length > 1) warn = '<div class="warn">土地は手札のどちらか1枚分しかありません（両方は唱えられない）</div>';
  else if (id === 'BURST' && L >= 5) warn = '<div class="warn">土地5枚：キッカーを払って4点にできます</div>';
  else if (id === 'DIVINE' && L >= 4) warn = '<div class="warn">土地4枚：キッカーを払えます</div>';
  else if (id === 'REBUKE' && L < 5) warn = '<div class="warn">土地が5枚未満：タップ状態のクリーチャーにだけ唱えられます</div>';
  if (isCre(id)) return `<div class="cardtext show"><div class="nm">${cname(id)} <span class="en">${cmana(id)}・クリーチャー</span></div>${creText(id)}${warn}</div>`;
  const C = CARDS[id];
  return `<div class="cardtext show"><div class="nm">${cname(id)} <span class="en">${C.en}・${C.mana}・インスタント</span></div>${C.desc}${warn}</div>`;
}
function candsHtml() {
  const P = puzzle;
  let h = `<div class="cands">その1枚は、次のどれか（各${Math.round(100 / P.scen.length)}%・均等）：${P.scen.map((id, i) => `<span class="cand ${id ? '' : 'none'}" data-cand="${i}">${id ? (isCre(id) ? (hcd(id).haste ? '⚡' : '🌀') + cshort(id) : cname(id)) : '基本土地'}</span>`).join('')}</div>`;
  if (typeof showCard === 'string' && showCard[0] === 'c') {
    const id = P.scen[+showCard.slice(1)];
    if (id && isCre(id)) h += `<div class="cardtext show"><div class="nm">${cname(id)} <span class="en">${cmana(id)}・クリーチャー</span></div>${creText(id)}</div>`;
    else if (id) { const C = CARDS[id]; h += `<div class="cardtext show"><div class="nm">${cname(id)} <span class="en">${C.en}・${C.mana}・インスタント</span></div>${C.desc}</div>`; }
    else h += `<div class="cardtext show"><div class="nm">基本土地</div>相手の手札1枚は基本土地です（扱いは「前提ルール」を参照）。</div>`;

}
function hasteInHand() { return (puzzle.hand[0] || []).find(id => isCre(id) && hcd(id).haste && castable(0, id)); }

function firstCast(line, side) { return line ? line.find(e => e.t === 'cast' && e.by === side && e.tg.length) : null; }
function tgPlain(t) { return t[0] === 'P' ? sideName(t[1]) : NM[t[0]][t[1]]; }
function insight(you, bests) {
  const b = bests[0], P = puzzle, msgs = [];
  const isNaive = !you.cast && P.naiveBest.some(a => sameSet(a, you.attackers));
  if (you.grade !== 'best') {
    if (isNaive && P.mode === 'fdn') msgs.push('<b>手札を考えなければ正解に見える手</b>です。');
    const oc = firstCast(you.line, 1);
    if (oc) msgs.push(`この攻撃には相手の${cname(oc.c)}が刺さります（→ ${oc.tg.map(tgPlain).join('・')}）。`);
    if (you.grade === 'loss') msgs.push('相手の最善の反撃で先にライフを削り切られます。攻撃してタップした生物は、相手のターンにブロックできません。');
    else if (you.grade === 'slow') msgs.push(`勝てますが、最善（${outLabel(b.c)}）より決着が遅くなり、相手に余計な手番を与えます。`);
    else if (you.grade === 'open') msgs.push('負けはしませんが、より良い攻め方があります。');
  }
  const mc = firstCast(b.line, 0);
  if (b.cast && you.cast !== b.cast) msgs.push(`最善手は、${cname(b.cast)}を戦闘前に唱えて攻撃に加えることです。`);
  if (mc) msgs.push(`最善の展開では、あなたの${cname(mc.c)}を ${mc.tg.map(tgPlain).join('・')} に使います。`);
  else if (P.hand[0].length && b.c.cls === 'win') msgs.push(`最善の展開では、あなたの手札は使わずに勝てます（構えておくこと自体が効いています）。`);
  if (P.best.cls !== 'win') msgs.push('この盤面は勝ち切れないので、「負けない」ことが最優先です。');
  return msgs.join('');
}
function verdictHead(you) {

  const big = you.grade === 'best' ? '◎ 正解！' : you.grade === 'slow' ? '○ 惜しい' : you.grade === 'open' ? '△ 不正解' : '× 不正解';

}
function lineSection(title, inner) {

function caseSummary(o) {
  const P = puzzle, g = { win: [], loss: [], open: [] };
  o.cells.forEach((c, i) => g[c.c.cls].push(scenShort(P.scen[i])));
  const parts = [];
  if (g.win.length) parts.push(`${g.win.join('・')}なら<b>勝ち</b>`);
  if (g.open.length) parts.push(`${g.open.join('・')}なら<b>${P.maxPly / 2}往復以内には決着つかず</b>`);
  if (g.loss.length) parts.push(`${g.loss.join('・')}なら<b>負け</b>`);
  return parts.join('、');
}
const cellCls = c => c.cls === 'win' ? 'w' : c.cls === 'loss' ? 'l' : 'o';
const cellTxt = c => c.cls === 'win' ? '勝' : c.cls === 'loss' ? '負' : '分';

    }).join('')}</tbody></table>
    <div class="hint">◎最善（勝てる手の中で勝率の差5%以内） ○惜しい（15%以内・正解扱い） ×不正解（一度も勝てない手を含む）／勝＝勝ち 負＝負け 分＝決着つかず（小さい数字は決着するターン）</div>

}
function nextButtons() {
  const label = reviewing ? (review.length ? '次の復習 →' : '復習を終える') : '次の問題 →';
  return `<div class="actions"><button class="btn sec" id="retry">解き直す</button><button class="btn" id="next">${label}</button></div>`;
}

// ---------- 共有 ----------
function shareHtml() {
  return `<div class="share"><div class="sid">問題ID：<code>${puzzle.id}</code></div>
    <div class="sbtns"><button data-copy="link">🔗 リンク</button><button data-copy="q">📋 問題文</button><button data-copy="qa">📋 答え付き</button></div>
    <div class="sid" style="margin-top:6px">リンクは、このアプリを共有した相手が開けます（問題IDから同じ盤面を復元）</div>
    <div id="copyArea"></div></div>`;
}
function puzzleText(withAnswer) {
  const P = puzzle;
  const crLine = side => (side ? P.board.op : P.board.me).map((c, i) => `${NM[side][i]} ${c.p}/${c.t}${kwList(c).length ? ' ' + kwList(c).join('・') : ''}${side === 1 && (P.tapped >> i & 1) ? '（タップ中）' : ''}`).join('　');
  const handTxt = side => P.mode === 'basic' ? '' : (side === 1 && P.mode === 'read')
    ? ` 土地${P.lands[1]} 手札1枚（${P.scen.map(scenShort).join('／')} のどれか・均等）`
    : ` 土地${P.lands[side]} 手札${P.hand[side].length ? P.hand[side].length + '枚 ' + P.hand[side].map(cname).join('・') : '0枚'}`;
  const L = [`【殴り算】${MODE_JA[P.mode]}・${LEVEL_JA[P.level]}`,
    `相手 ライフ${P.life[1]}${handTxt(1)}`, `　${crLine(1)}`,
    `あなた ライフ${P.life[0]}${handTxt(0)}`, `　${crLine(0)}`,
    'Q. どの生物で攻撃する？（あなたのターン・戦闘フェイズ）'];
  if (withAnswer) {
    const bests = P.opts.filter(o => o.grade === 'best');
    if (P.mode === 'read') {
      const top = bests.slice().sort((a, b) => b.ev - a.ev)[0];
      L.push('', `A. ${bests.map(optLabel).join(' / ')}（勝率${pct(top.ev)}）`);
      L.push(`　${caseSummary(top).replace(/<[^>]+>/g, '')}`);
    } else L.push('', `A. ${bests.map(optLabel).join(' / ')} → ${outLabel(bests[0].c)}`);
  }
  L.push(`${ART_URL}#${P.id}`);
  return L.join('\n');
}
function copyText(text) {
  const fallback = () => {
    const a = document.getElementById('copyArea');
    if (a) { a.innerHTML = `<textarea class="copybox" readonly></textarea><div class="sid">自動コピーできなかったので、上の文字を長押しでコピーしてください</div>`; const ta = a.querySelector('textarea'); ta.value = text; ta.focus(); ta.select(); }
  };
  try { navigator.clipboard.writeText(text).then(() => toast('コピーしました'), fallback); } catch (e) { fallback(); }
}
let toastT = 0;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

// ---------- 成績 ----------
function showStats() {
  rk.open = false;
  const cell = s => s.n ? `${Math.round(s.best / s.n * 100)}%<small>${s.best}/${s.n}</small>` : '—';
  const sum = m => LEVELS.reduce((a, l) => ({ n: a.n + stats[m][l].n, best: a.best + stats[m][l].best }), { n: 0, best: 0 });
  document.getElementById('sheet').innerHTML = `<h2>📊 成績（正解率）</h2>
    <table class="stbl"><tr><th></th>${LEVELS.map(l => `<th>${LEVEL_JA[l]}</th>`).join('')}<th>合計</th></tr>
    ${MODES.map(m => `<tr><td>${MODE_JA[m]}</td>${LEVELS.map(l => `<td>${cell(stats[m][l])}</td>`).join('')}<td>${cell(sum(m))}</td></tr>`).join('')}</table>
    <div class="hint">復習待ち：<b>${review.length}</b>問（間違えた問題がたまり、復習で正解すると消えます）。復習中の解答は成績に含めません。</div>
    <button class="btn sec close" id="closeModal">閉じる</button>`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('closeModal').onclick = () => document.getElementById('modal').classList.remove('show');
}
// ---------- ランキング（共有DB：ranking/<ユーザーID>） ----------
const rk = { db: null, user: null, uid: null, rows: [], state: 'init', blocked: false, writing: false, dirty: false, names: {}, isOwner: false, tab: 'read', armed: null, open: false };
const clampN = v => { const n = Math.floor(Number(v)); return Number.isFinite(n) && n > 0 ? Math.min(n, 9999) : 0; };
function sanitizeRow(id, d) {
  const r = { id, name: typeof d.name === 'string' ? d.name.slice(0, 16) : '' };
  MODES.forEach(m => { r[m] = clampN(d[m]); r[m + 'At'] = typeof d[m + 'At'] === 'string' ? d[m + 'At'].slice(0, 12) : ''; });
  return r;
}
let rkInit = null;
const ensureRanking = () => rkInit || (rkInit = initRanking());
async function initRanking() {
  let cl = window.claude;
  if ((!cl || typeof cl.use !== 'function') && window.__claudePromise) cl = await window.__claudePromise;
  if (!cl || typeof cl.use !== 'function') { rk.state = 'off'; refreshRanking(); return; }
  try {
    const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
    if (!db) { rk.state = 'off'; refreshRanking(); return; }
    rk.db = db; rk.user = user;
    if (user) {
      try { rk.uid = await user.id(); } catch (e) { rk.uid = null; }
      try { rk.isOwner = !!(await user.isOwner()); } catch (e) {}
      try { const c = await user.can('data.write'); if (c === false) rk.blocked = true; } catch (e) {}
    }
    rk.needLogin = HOSTED && !rk.uid;
    if (HOSTED && window.__auth) { try { const c = await window.__auth.current(); rk.gname = c ? c.name : ''; } catch (e) {} }
    if (!rk.uid && !HOSTED) rk.blocked = true;
    rk.state = 'loading'; refreshRanking();
    const timer = setTimeout(() => { if (rk.state === 'loading') { rk.state = 'timeout'; refreshRanking(); } }, 10000);
    rk.unsub = db.collection('ranking').onSnapshot(snap => {
      rk.rows = snap.docs.filter(d => d.exists).map(d => sanitizeRow(d.id, d.data() || {}));
      if (!snap.metadata.fromCache) { clearTimeout(timer); rk.state = 'ready'; if (rk.pendingPush) { rk.pendingPush = false; setTimeout(pushMine, 0); } }
      resolveNames(); refreshRanking();
    }, () => { clearTimeout(timer); rk.state = 'off'; refreshRanking(); });
  } catch (e) { rk.state = 'off'; refreshRanking(); }
}
async function resolveNames() {
  if (!rk.user || typeof rk.user.profiles !== 'function') return;
  const ids = rk.rows.filter(r => !r.name).map(r => r.id);
  if (!ids.length) return;
  try { const ps = await rk.user.profiles(ids); ids.forEach(id => { rk.names[id] = (ps && ps[id] && ps[id].name) || ''; }); refreshRanking(); } catch (e) {}
}
const myRow = () => rk.rows.find(r => r.id === rk.uid);
const myBest = m => Math.max(bestRec[m].best, (myRow() || {})[m] || 0);
// 自分の記録をランキングへ（ユーザー操作や記録更新のときだけ呼ぶ。1文書1書き込みずつ）
async function pushMine() {
  if (!rk.db || !rk.uid || rk.blocked || rk.state === 'off') return;
  if (rk.state !== 'ready') { rk.pendingPush = true; return; }   // 自分の既存記録を読んでから書く
  if (rk.writing) { rk.dirty = true; return; }
  const mine = myRow();
  const body = { name: playerName.slice(0, 16) };
  let changed = !mine || (mine.name || '') !== body.name;
  MODES.forEach(m => {
    const remote = mine ? mine[m] : 0, local = bestRec[m].best;
    body[m] = Math.max(remote, local);
    body[m + 'At'] = local > remote ? bestRec[m].date : (mine ? mine[m + 'At'] : '') || bestRec[m].date || '';
    if (body[m] !== remote) changed = true;
  });
  if (!changed || !MODES.some(m => body[m] > 0)) return;
  rk.writing = true;
  try { await rk.db.collection('ranking').doc(rk.uid).set(body); }
  catch (e) {
    const code = e && e.code;
    if (code === 'unavailable') setTimeout(pushMine, 1200 + Math.random() * 1200);
    else { rk.blocked = true; if (code === 'quota_exceeded') toast('ランキングの保存容量がいっぱいです'); }
  }
  rk.writing = false;
  if (rk.dirty) { rk.dirty = false; pushMine(); }
  refreshRanking();
}
function rankListHtml() {
  const m = rk.tab;
  if (rk.state === 'init') return '<div class="rkst">読み込み中…</div>';
  if (rk.state === 'off') return HOSTED ? '<div class="rkst warn">ランキングに接続できません。通信状況を確認して、ページを再読み込みしてください。</div>' : `<div class="rkst warn">ランキングに接続できません。claude.aiにサインインした状態で、共有されたこのアプリを開くと表示されます。</div>`;
  const rows = rk.rows.filter(r => r[m] > 0).sort((a, b) => b[m] - a[m] || (a[m + 'At'] || '').localeCompare(b[m + 'At'] || '')).slice(0, 50);
  let h = rk.state === 'loading' ? '<div class="rkst">読み込み中…</div>' : rk.state === 'timeout' ? '<div class="rkst warn">ランキングをまだ読み込めていません（表示が古い可能性があります）</div>' : '';
  if (!rows.length) return h + '<div class="rkst">まだ記録がありません。最初の1人になろう！</div>';
  let rank = 0, prev = null;
  h += '<ol class="rk">' + rows.map((r, i) => {
    if (r[m] !== prev) { rank = i + 1; prev = r[m]; }
    const name = r.name || rk.names[r.id] || 'プレイヤー';
    const del = rk.isOwner ? `<button class="del ${rk.armed === r.id ? 'arm' : ''}" data-del="${esc(r.id)}">${rk.armed === r.id ? '削除する' : '×'}</button>` : '';
    return `<li class="${r.id === rk.uid ? 'me' : ''}"><span class="n">${rank}</span><span class="nm2">${esc(name)}${r.id === rk.uid ? '（あなた）' : ''}<small>${esc(r[m + 'At'] || '')}</small></span><span class="v">${r[m]}<small>問</small></span>${del}</li>`;
  }).join('') + '</ol>';
  return h;
}
function rankingHtml() {
  const m = rk.tab;
  const mine = myRow();
  const regNote = (HOSTED && rk.needLogin && rk.state !== 'off')
    ? `<div class="login"><button class="gbtn" id="gLogin">Googleでログインしてランキングに参加</button>
       <div class="rkst" style="margin:8px 0 0">ランキングを見るだけならログイン不要です。ログインすると記録が自動で登録され、別の端末でも同じ記録で続けられます（Googleの名前やメールアドレスは公開されません。表示されるのはプレイヤー名だけです）。<br>※Xなどのアプリ内ブラウザではログインできないことがあります。その場合はSafariやChromeで開いてください。</div></div>`
    : rk.blocked
    ? (HOSTED ? '<div class="rkst warn">記録をランキングに登録できませんでした。ページを再読み込みしてもう一度お試しください。</div>'
      : '<div class="rkst warn">このアカウントは閲覧のみの権限のため、記録をランキングに登録できません（参加するには、アプリのオーナーからメールで招待してもらう必要があります）。</div>')
    : (!mine && rk.state === 'ready' && MODES.some(x => bestRec[x].best > 0) ? '<div class="rkst">プレイヤー名を入れて「登録」を押すと、ランキングに載ります。</div>' : '');
  return `<h2>🏆 ランキング（むずかしい・最高連続正解）</h2>
    <div class="rktabs">${MODES.map(x => `<button data-rk="${x}" class="${x === m ? 'on' : ''}">${MODE_JA[x]}</button>`).join('')}</div>
    <div id="rkList">${rankListHtml()}</div>
    <div class="rkme">あなた（${MODE_JA[m]}・むずかしい）：自己ベスト <b>${myBest(m)}</b>問　現在の連続 ${stats[m].hard.streak}問</div>
    <div class="pname">プレイヤー名<input id="pname" maxlength="16" placeholder="ランキングに表示する名前" value="${esc(playerName)}"><button id="pnameSave">登録</button></div>
    ${regNote}
    ${HOSTED && rk.uid ? `<div class="rkst">ログイン中${rk.gname ? '：' + esc(rk.gname) + '（あなたにだけ表示）' : ''}<button class="linkbtn" id="gLogout">ログアウト</button></div>` : ''}
    <div class="hint">・「むずかしい」で出題された問題を、続けて何問正解できたかの自己ベストで競います（記録は自動で更新）<br>
    ・復習やリンクから開いた問題は対象外。未回答のまま他へ移っても、次に同じモードの「むずかしい」を開くと<b>同じ問題から再開</b>します</div>
    <button class="btn sec close" id="closeModal">閉じる</button>`;
}
function bindRanking() {
  const close = document.getElementById('closeModal');
  if (close) close.onclick = () => { rk.open = false; document.getElementById('modal').classList.remove('show'); };
  document.querySelectorAll('[data-rk]').forEach(b => b.onclick = () => { rk.tab = b.dataset.rk; showRanking(true); });
  const save = document.getElementById('pnameSave'), inp = document.getElementById('pname');
  if (save) save.onclick = async () => {
    playerName = inp.value.trim().slice(0, 16); store.set('cd_name', playerName);
    if (HOSTED && rk.needLogin) { toast('名前を保存しました。Googleでログインするとランキングに載ります'); return; }
    await pushMine(); toast(rk.blocked ? '名前を保存しました（ランキングには登録できません）' : 'ランキングに登録しました'); showRanking(true);
  };
  const gl = document.getElementById('gLogin');
  if (gl) gl.onclick = async () => {
    try { await window.__auth.signIn(); }
    catch (e) {
      const c = (e && e.code) || '';
      toast(c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' ? 'ログインをキャンセルしました'
        : c === 'auth/popup-blocked' ? 'ポップアップがブロックされました。許可してからもう一度押してください'
        : 'ログインできませんでした。SafariやChromeで開いてお試しください');
      return;
    }
    await restartRanking(); toast('ログインしました'); pushMine(); showRanking(true);
  };
  const lo = document.getElementById('gLogout');
  if (lo) lo.onclick = async () => { try { await window.__auth.signOut(); } catch (e) {} await restartRanking(); toast('ログアウトしました'); showRanking(true); };
  bindDel();
}
async function restartRanking() {
  if (rk.unsub) { try { rk.unsub(); } catch (e) {} rk.unsub = null; }
  Object.assign(rk, { uid: null, rows: [], state: 'init', blocked: false, needLogin: false, pendingPush: false, writing: false, dirty: false, gname: '' });
  rkInit = null;
  await ensureRanking();
}
function bindDel() {
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const id = b.dataset.del;
    if (rk.armed !== id) { rk.armed = id; refreshRanking(); return; }
    rk.armed = null;
    try { await rk.db.collection('ranking').doc(id).delete(); toast('削除しました'); } catch (e) { toast('削除できませんでした'); }
  });
}
function showRanking(keep) {
  rk.open = true;
  if (!keep) { rk.tab = mode; ensureRanking().then(pushMine); }
  document.getElementById('sheet').innerHTML = rankingHtml();
  document.getElementById('modal').classList.add('show');
  bindRanking();
}
function refreshRanking() {
  if (!rk.open) return;
  const el = document.getElementById('rkList');
  if (el) { el.innerHTML = rankListHtml(); bindDel(); }
}
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') { rk.open = false; e.currentTarget.classList.remove('show'); } };

// ---------- events ----------
function bind() {
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on('prem', () => { showPremise = !showPremise; render(); });
  on('revStop', stopReview);
  document.querySelectorAll('[data-card]').forEach(el => el.onclick = () => { const s = el.dataset.card; showCard = showCard === s ? -1 : s; render(); });
  document.querySelectorAll('[data-cand]').forEach(el => el.onclick = () => { const s = 'c' + el.dataset.cand; showCard = showCard === s ? -1 : s; render(); });
  if (!answered) {
    document.querySelectorAll('#merow .card').forEach(el => { el.onclick = () => {
      const i = +el.dataset.i;
      if (i < puzzle.board.me.length && puzzle.board.me[i].df) { toast('防衛を持つクリーチャーは攻撃できません'); return; }
      sel.has(i) ? sel.delete(i) : sel.add(i); render(); }; });
    on('castBtn', () => { if (castSel) { sel.delete(slotOf(castSel)); castSel = null; } else castSel = hasteInHand(); render(); });
    on('go', submit);
    return;
  }
  document.querySelectorAll('[data-v]').forEach(el => el.onclick = () => { viewIdx = +el.dataset.v; lineOpen = true; scrollToLine = true; render(); });
  document.querySelectorAll('[data-cell]').forEach(el => el.onclick = () => { viewCell = el.dataset.cell.split(',').map(Number); lineOpen = true; scrollToLine = true; render(); });
  on('lineSec', () => { lineOpen = !lineOpen; render(); });
  document.querySelectorAll('[data-copy]').forEach(el => el.onclick = () => {
    const t = el.dataset.copy;
    copyText(t === 'link' ? `${ART_URL}#${puzzle.id}` : puzzleText(t === 'qa'));
  });
  on('next', () => {
    window.scrollTo(0, 0);
    if (reviewing) { if (review.length) loadId(review[0].id); else { reviewing = false; toast('復習完了！'); newPuzzle(); } }
    else newPuzzle();
  });
  on('retry', () => { answered = false; sel = new Set(); castSel = null; viewIdx = -1; viewCell = null; lineOpen = false; render(); });
}

function submit() {
  const mine = [...sel].sort((a, b) => a - b);
  const you = puzzle.opts.find(o => optMatch(o, castSel, mine));
  if (!you) { toast('その組み合わせは選べません'); return; }
  if (!puzzle.scored) {
    puzzle.scored = true;
    const ok = you.grade === 'best' || you.grade === 'slow';   // ○（惜しい）も正解扱い
    if (reviewing) {
      const idx = review.findIndex(r => r.id === puzzle.id);
      if (idx >= 0) { const [it] = review.splice(idx, 1); if (!ok) review.push(it); }
      saveReview();
    } else {
      if (puzzle.fresh) {
        const st = stats[puzzle.mode][puzzle.level];
        st.n++;
        if (ok) { st.best++; st.streak++; st.top = Math.max(st.top, st.streak); }
        else { if (you.grade === 'slow') st.slow++; st.streak = 0; }
        store.set('cd_stats3', stats);
        if (puzzle.level === 'hard') {
          if (pending[puzzle.mode] === puzzle.id) { delete pending[puzzle.mode]; store.set('cd_pending', pending); }
          const br = bestRec[puzzle.mode];
          if (ok && st.streak > br.best) {
            br.best = st.streak; const d = new Date(); br.date = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
            store.set('cd_best', bestRec);
            setTimeout(() => toast(`🏆 自己ベスト更新！ ${MODE_JA[puzzle.mode]}・むずかしい 連続${br.best}問`), 400);
            ensureRanking().then(pushMine);
          }
        }
      }
      if (!ok && !review.some(r => r.id === puzzle.id)) { review.push({ id: puzzle.id }); if (review.length > 100) review.shift(); saveReview(); }
      renderScore();
    }
  }
  answered = true; viewIdx = -1; viewCell = null; lineOpen = false;
  if (curRec.id === puzzle.id) { curRec.answered = true; store.set('cd_cur', curRec); }
  render();
  const r = document.querySelector('.result');
  if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderScore() {
  const st = stats[mode][level];
  const p = st.n ? Math.round(st.best / st.n * 100) : 0;
  const extra = level === 'hard' ? `・ベスト <b>${myBest(mode)}</b>` : '';
  document.getElementById('score').innerHTML = `${MODE_JA[mode]}・${LEVEL_JA[level]}<br>正解 <b>${st.best}</b>/${st.n}（${p}%）連続 <b>${st.streak}</b>${extra}`;
}
function renderSeg() {
  document.querySelectorAll('#levels button').forEach(b => {
    b.classList.toggle('on', b.dataset.lv === level);
    b.onclick = () => { if (level === b.dataset.lv && !reviewing) return; reviewing = false; level = b.dataset.lv; store.set('cd_level', level); renderSeg(); renderScore(); newPuzzle(); };
  });
  document.querySelectorAll('#modes button').forEach(b => {
    b.classList.toggle('on', b.dataset.m === mode);
    b.onclick = () => { if (mode === b.dataset.m && !reviewing) return; reviewing = false; mode = b.dataset.m; store.set('cd_mode', mode); renderSeg(); renderScore(); newPuzzle(); };
  });
}
document.getElementById('reset').onclick = () => { MODES.forEach(m => LEVELS.forEach(l => { stats[m][l] = emptyStats(); })); store.set('cd_stats3', stats); renderScore(); toast('成績をリセットしました（連続正解の自己ベストは残ります）'); };
document.getElementById('revBtn').onclick = startReview;
document.getElementById('statBtn').onclick = showStats;
document.getElementById('recBtn').onclick = () => showRanking(false);
window.addEventListener('hashchange', () => {
  const h = (location.hash || '').slice(1);
  if (h && (!puzzle || h !== puzzle.id)) loadId(h);
});

window.__cd = { get puzzle() { return puzzle; }, encode, decode };
renderSeg(); renderScore(); saveReview();
if (!HOSTED) ensureRanking();
const h0 = (location.hash || '').slice(1);
if (h0 && decode(h0)) loadId(h0); else newPuzzle();
})();
